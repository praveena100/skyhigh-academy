<!DOCTYPE html>
<html>
<head>
  <title>Sky High Admin Login</title>

  <style>

    body{
      margin:0;
      font-family:Arial;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      background:#f4f7fb;
    }

    .login-box{
      width:350px;
      background:white;
      padding:40px;
      border-radius:12px;
      box-shadow:0 5px 20px rgba(0,0,0,0.1);
    }

    h2{
      text-align:center;
      margin-bottom:30px;
      color:#1565c0;
    }

    input{
      width:100%;
      padding:12px;
      border:1px solid #ccc;
      border-radius:8px;
      margin-bottom:20px;
      font-size:16px;
      box-sizing:border-box;
    }

    button{
      width:100%;
      padding:12px;
      border:none;
      background:#1565c0;
      color:white;
      border-radius:8px;
      cursor:pointer;
      font-size:16px;
    }

    button:hover{
      background:#0d47a1;
    }

  </style>
</head>

<body>

<div class="login-box">

  <h2>Admin Login</h2>

  <input
    type="password"
    id="password"
    placeholder="Enter admin password"
  >

  <button onclick="login()">
    Login
  </button>

</div>

<script>

async function login(){

  const password =
    document.getElementById("password").value;

  try{

    const response = await fetch(
      "http://localhost:5000/admin/login",
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({ password })
      }
    );

    const data = await response.json();

    if(data.success){

      localStorage.setItem(
        "adminLoggedIn",
        "true"
      );

      window.location.href =
        "dashboard.html";

    }else{

      alert("Wrong Password");
    }

  }catch(error){

    console.log(error);

    alert("Server Error");
  }
}

</script>

</body>
</html>
