<!DOCTYPE html>
<html>
<head>

  <title>Admin Dashboard</title>

  <meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
  />

  <style>

    body{
      margin:0;
      font-family:Arial;
      background:#f4f7fb;
      padding:40px;
    }

    .top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
  gap:15px;
  flex-wrap:wrap;
  }

    button{
        max-width:100%;
      padding:10px 20px;
      border:none;
      background:#1565c0;
      color:white;
      border-radius:8px;
      cursor:pointer;
    }

    .card{
      background:white;
      padding:30px;
      border-radius:12px;
      box-shadow:0 5px 20px rgba(0,0,0,0.08);
    }

    @media(max-width:768px){

body{
  padding:15px;
}

h1{
  font-size:24px;
}

.card{
  padding:15px;
}

table{
  font-size:14px;
}

input{
  font-size:14px;
}

button{
  font-size:14px;
  padding:8px 12px;
  max-width:100%;
}

.top{
  gap:15px;
  flex-wrap:wrap;
}
}

</style>

  </style>

</head>

<body>

<div class="top">

  <h1>
    Sky High Admin Dashboard
  </h1>

  <button onclick="logout()">
    Logout
  </button>

</div>

<div
  style="
    background:#1565c0;
    color:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
    font-size:22px;
    font-weight:bold;
  "
>

  Total Enrollments:
  <span id="totalStudents">
    0
  </span>

</div>

<div class="card">

    <h2>
      Student Enrollments
    </h2>

    <input
  type="text"
  id="searchInput"
  placeholder="Search by name, phone or type..."
  onkeyup="searchStudents()"
  style="
    width:100%;
    padding:12px;
    margin-top:15px;
    margin-bottom:20px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
    box-sizing:border-box;
  "
  >
  
    <br>


    <div style="overflow-x:auto;">
    <table
      border="1"
      width="100%"
      cellpadding="12"
      style="
        border-collapse:collapse;
        background:white;
      "
    >
  
      <thead>
  
        <tr style="background:#1565c0;color:white;">
  
          <th>ID</th>
          <th>Name</th>
          <th>Phone</th>
          <th>Type</th>
          <th>Details</th>
          <th>Date</th>
          <th>Action</th>
  
        </tr>
  
      </thead>
  
      <tbody id="studentTableBody">
  
      </tbody>
  
    </table>

</div>
  
  </div>

<script>

loadStudents();

async function loadStudents(){

  try{

    const response = await fetch(
      "https://skyhigh-backend-p60o.onrender.com/admin/students"
    );

    const data = await response.json();

    if(data.success){

        document.getElementById(
        "totalStudents"
         ).innerText =
         data.students.length;

      let rows = "";

      data.students.forEach(student => {

        rows += `

          <tr>

            <td>${student.id}</td>

            <td>${student.student_name}</td>

            <td>${student.phone}</td>

            <td>${student.student_type}</td>

            <td>

             <button onclick='viewDetails(${JSON.stringify(student.extra_details)})'>

              View

              </button>

            </td>

            <td>
              ${student.created_at}
            </td>

            <td>

           <button onclick="deleteStudent(${student.id})">

            Delete

           </button>

           </td>

          </tr>
        `;
      });

      document.getElementById(
        "studentTableBody"
      ).innerHTML = rows;
    }

  }catch(error){

    console.log(error);

    alert("Failed to load students");
  }
}

  // PROTECT PAGE

  if(localStorage.getItem("adminLoggedIn") !== "true"){

    window.location.href =
      "skyhigh-super-admin-login.html";
  }

  // LOGOUT

  function logout(){

    localStorage.removeItem("adminLoggedIn");

    window.location.href =
      "skyhigh-super-admin-login.html";
  }

  function searchStudents(){

const input =
  document.getElementById("searchInput")
  .value
  .toLowerCase();

const rows =
  document.querySelectorAll(
    "#studentTableBody tr"
  );

rows.forEach(row => {

  const text =
    row.innerText.toLowerCase();

  if(text.includes(input)){

    row.style.display = "";

  }else{

    row.style.display = "none";
  }
});
}

async function deleteStudent(id){

const confirmDelete =
  confirm("Delete this student?");

if(!confirmDelete){
  return;
}

try{

  const response = await fetch(

    `https://skyhigh-backend-p60o.onrender.com/admin/delete/${id}`,

    {
      method:"DELETE"
    }
  );

  const data = await response.json();

  if(data.success){

    alert("Student deleted");

    loadStudents();

  }else{

    alert("Delete failed");
  }

}catch(error){

  console.log(error);

  alert("Server error");
}
}

function viewDetails(details){

document.getElementById(
  "popup"
).style.display = "flex";

document.getElementById(
  "popupContent"
).innerHTML = `

  <pre
    style="
      white-space:pre-wrap;
      line-height:1.8;
    "
  >
${details}
  </pre>
`;
}

function closePopup(){

document.getElementById(
  "popup"
).style.display = "none";
}



</script>

<div
  id="popup"
  style="
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    justify-content:center;
    align-items:center;
  "
>

  <div
    style="
      background:white;
      width:400px;
      padding:25px;
      border-radius:12px;
      position:relative;
    "
  >

    <h2>
      Student Details
    </h2>

    <div id="popupContent"></div>

    <br>

    <button onclick="closePopup()">
      Close
    </button>

  </div>

</div>

</body>
</html>
